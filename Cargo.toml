[package]
name = "mimesia"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "Record, replay, and verify web app shells for demos"
repository = "https://github.com/sethjuarez/mimesia"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
percent-encoding = "2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
